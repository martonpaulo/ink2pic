name: Prerelease

# Each device test build becomes a GitHub prerelease with Ink2Pic.snplg (#22).
# A cloud session can neither create a release nor push a tag (HTTP 403), so a push to main
# that changes PluginConfig.json publishes too, when its v<versionName>-dev.<versionCode> tag
# does not exist yet (owner decision D2 A, 2026-11-06). A tag pushed from a Mac still works.

on:
  push:
    tags: ['v*-dev.*']
    branches: [main]
    # A notes fix retries a release whose run failed; an existing tag is skipped.
    paths: [PluginConfig.json, 'docs/releases/**']

permissions:
  contents: read

jobs:
  prerelease:
    name: prerelease
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Check out the pushed commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve the tag from PluginConfig.json
        id: tag
        run: |
          expected="$(node -p "const c = require('./PluginConfig.json'); 'v' + c.versionName + '-dev.' + c.versionCode")"
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            if [ "$GITHUB_REF_NAME" != "$expected" ]; then
              echo "::error::Tag $GITHUB_REF_NAME does not match PluginConfig.json ($expected)."
              exit 1
            fi
          elif gh release view "$expected" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::notice::$expected is already published; nothing to do."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "TAG=$expected" >> "$GITHUB_ENV"
          echo "publish=true" >> "$GITHUB_OUTPUT"
          if [ ! -f "docs/releases/$expected.md" ]; then
            echo "::error::Missing release notes docs/releases/$expected.md."
            exit 1
          fi

      - name: Set up Node.js
        if: steps.tag.outputs.publish == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        if: steps.tag.outputs.publish == 'true'
        run: npm ci

      - name: Run the gate
        if: steps.tag.outputs.publish == 'true'
        run: npm run validate

      - name: Build the plugin package
        if: steps.tag.outputs.publish == 'true'
        # The JS package, then the Java module (#11); native-toolchain.sh reuses the runner's SDK.
        run: npm run build

      - name: Create the prerelease
        if: steps.tag.outputs.publish == 'true'
        run: |
          # On a branch push, --target creates the tag on the pushed commit.
          gh release create "$TAG" build/outputs/Ink2Pic.snplg \
            --prerelease --target "$GITHUB_SHA" --title "$TAG" \
            --notes-file "docs/releases/$TAG.md"

      - name: Read the asset back
        if: steps.tag.outputs.publish == 'true'
        run: |
          names="$(gh release view "$TAG" --json assets --jq '.assets[].name')"
          echo "$names"
          case "$names" in
            *Ink2Pic.snplg*) ;;
            *) echo "::error::Ink2Pic.snplg is missing from $TAG."; exit 1 ;;
          esac
